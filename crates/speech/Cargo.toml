[package]
name = "filmcraft-speech"
description = "FilmCraft speech-to-text: the Transcriber trait in FilmCraft's types, on craft-ai's speech to text (Whisper on the CPU or a GPU, the model catalogue, endpoints, speaker labelling)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Whisper here (craft-ai's `speech`): on the CPU, or a GPU with `cuda` (NVIDIA) or `metal` (Apple).
whisper = ["craft-ai/speech"]
cuda = ["whisper", "craft-ai/cuda"]
metal = ["whisper", "craft-ai/metal"]
# Model downloads: craft-ai always has them; kept so the engine's feature names stay.
download = []

[dependencies]
filmcraft-time = { workspace = true }
filmcraft-project = { workspace = true }
craft-ai = { workspace = true }
